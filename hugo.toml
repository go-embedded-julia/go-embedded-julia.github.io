baseURL = 'https://go-embedded-julia.github.io/'
locale  = 'en-us'
title   = 'go-embedded-julia'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-embedded-julia (in development: milestones M0, the oracle harness, and M1, the parser): a Julia interpreter in pure Go that can be embedded, for the julia cells of go-notebook and its WebAssembly playground."

# Every field below is rendered by layouts/index.html. A field nothing renders
# does not stay true. Every statement is from the roadmap's bibliography,
# bib/julia.md (go-scikit/roadmap, pull request 12); none is a result.
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-embedded-julia.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the plan and its milestones, the architecture, the runtime boundary with its counts, and the licences. <a href=\"https://github.com/go-embedded-julia/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-embedded-julia/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants. The mark is Julia's subtype operator, <code>&lt;:</code>."

# The cards of #scope.
[[params.scope]]
  name = "Julia's own front end, in Go"
  what = "JuliaSyntax (the parser, 11 326 lines of Julia) and JuliaLowering (13 940 lines) ported to Go. Until Base is loaded no Julia can run, so the parser has to be native: a Go VM has no femtolisp."
[[params.scope]]
  name = "An interpreter over lowered IR"
  what = "The whole instruction set an interpreter must execute is 12 node types and 30 <code>Expr</code> heads. Julia's own C interpreter over it, <code>src/interpreter.c</code>, is 1 118 lines."
[[params.scope]]
  name = "Julia's Base, unchanged"
  what = "Base (140 705 lines of Julia) is run as is through the interpreter, at build time, and the resulting heap is shipped as an image. Nothing of Base is rewritten natively, so a Base fix upstream is not ported twice."
[[params.scope]]
  name = "The runtime boundary on fleet libraries"
  what = "Intrinsics, <code>ccall</code> targets and the runtime itself map onto Go: <code>math/big</code> and go-bignum for GMP and MPFR, go-ndarray for BLAS and LAPACK, the regexp stack of go-ruby-regexp for PCRE2, go-fft for FFTs."
[[params.scope]]
  name = "For go-notebook"
  what = "The <code>julia</code> cells of go-notebook and of its WebAssembly playground, the way rbgo, the Ruby VM of go-embedded-ruby, backs its <code>ruby</code> cells."
[[params.scope]]
  name = "Licences kept clean"
  what = "Julia is MIT, and its front end, runtime and Base may be translated to Go with the notice kept. The GPL parts of SuiteSparse are avoided, and GMP and MPFR (LGPL) are neither linked nor translated."

# The cards of #milestones, in order. state is "in development" for the two the
# plan has started, "planned" for the others.
[[params.milestones]]
  id    = "M0"
  name  = "Oracle harness"
  size  = "S"
  state = "in development"
  what  = "A Go tool that runs the reference <code>julia</code> (a pinned release) on a corpus and stores its outputs: parse trees, <code>Meta.lower</code>, <code>Test</code> summaries, printed values. Exit test: the outputs are checked in as golden files, regenerated by one command."
[[params.milestones]]
  id    = "M1"
  name  = "Parser"
  size  = "L"
  state = "in development"
  what  = "A Go port of <code>JuliaSyntax/src</code> (11 326 lines) producing a Go <code>Expr</code>, fuzzed with a depth and size bound. Exit test: <code>Expr</code>-identical on all 202 <code>base/</code> files, <code>stdlib/</code>, all 297 <code>test/</code> files and JuliaSyntax's own tests."
[[params.milestones]]
  id    = "M2"
  name  = "Lowering and macro expansion"
  size  = "L"
  state = "planned"
  what  = "A Go port of <code>JuliaLowering/src</code> (13 940 lines), with the missing rules taken from <code>julia-syntax.scm</code>. Exit test: <code>CodeInfo</code>-identical, modulo numbering, to <code>Meta.lower</code> on Base's top-level forms."
[[params.milestones]]
  id    = "M3"
  name  = "Core runtime"
  size  = "XL"
  state = "planned"
  what  = "Types, subtyping, method tables, dispatch, the 83 builtins, the 94 intrinsics, the interpreter and <code>boot.jl</code>. Exit test: <code>test/subtype.jl</code>, <code>specificity.jl</code>, <code>intrinsics.jl</code> and the parts of <code>core.jl</code> that need no Base I/O."
[[params.milestones]]
  id    = "M4"
  name  = "Base bootstrap and image"
  size  = "XL"
  state = "planned"
  what  = "<code>Base_compiler.jl</code> and <code>Base.jl</code> evaluated; the <code>jl_*</code>, libc and libuv shim (about 524 + 88 + 78 call sites); the Compiler interpreted for <code>_return_type</code>; an image writer and reader. Exit test: Base loads, and a list of <code>test/</code> files passes."
[[params.milestones]]
  id    = "M5"
  name  = "Numeric boundary"
  size  = "L"
  state = "planned"
  what  = "GMP and MPFR on <code>math/big</code> and go-bignum, a PCRE2 front end on go-ruby-regexp, utf8proc tables, a dSFMT port, Printf, Dates, Random, Statistics and LinearAlgebra on go-ndarray. Exit test: the gmp, mpfr, regex, unicode, rational and complex tests, and the standard-library tests, with seeded Random streams byte-identical."
[[params.milestones]]
  id    = "M6"
  name  = "Notebook bridge and go-scikit/julia"
  size  = "M"
  state = "planned"
  what  = "The Julia to Go value table, the names a cell defines and uses, errors and worker limits, and the go-scikit bindings. Exit test: a mixed Go and Julia example notebook transcript in the go-notebook docs."
[[params.milestones]]
  id    = "M7"
  name  = "WebAssembly playground"
  size  = "M"
  state = "planned"
  what  = "A lazily loaded Julia core, image loading, and SVG display through the existing sanitizer. Exit test: a first result in less time than the Ruby core on the same machine, with the size recorded."

# The cards of #boundary and their count come from this list. Each number is
# from the bibliography's sections 1 and 3, counted by a Go program over the
# Julia sources, not estimated.
[[params.boundary]]
  name = "94 intrinsics"
  what = "81 <code>ADD_I</code>, 12 <code>ALIAS</code> and 1 hidden. All but <code>llvmcall</code> and the pointer group map to Go in a few lines each, on <code>math/bits</code> and <code>math</code>."
[[params.boundary]]
  name = "83 builtins"
  what = "From <code>src/builtin_proto.h</code>: <code>getfield</code>, <code>setfield!</code>, <code>isa</code>, <code>===</code>, <code>apply_type</code>, <code>invoke</code> and the rest, each one a Go function."
[[params.boundary]]
  name = "896 ccall sites in base/"
  what = "856 <code>ccall</code> and 40 <code>@ccall</code> in 202 files. By target: 524 on the Julia runtime and <code>ios_*</code>, 88 on libc, 81 on MPFR (and 29 more generated by loops), 78 on libuv, 40 on GMP, 18 on PCRE2, 15 on utf8proc."
[[params.boundary]]
  name = "0 libm calls, 0 llvmcall"
  what = "Base's elementary functions are written in Julia over intrinsics, so they are bit-identical by construction, and Base has no <code>llvmcall(</code> site."
[[params.boundary]]
  name = "194 sites in LinearAlgebra"
  what = "182 call BLAS and LAPACK. They are implemented as Go functions over go-ndarray's <code>linalg</code> on the column-major buffer a Julia matrix owns, without copying. Missing kernels are added to go-ndarray, not to the VM."
[[params.boundary]]
  name = "No FFT in Julia's Base"
  what = "Neither Base nor the standard library has one: an FFTW.jl-style API over go-fft is a separate package, not part of the VM."

