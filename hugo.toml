baseURL = 'https://go-embedded-julia.github.io/'
locale  = 'en-us'
title   = 'go-embedded-julia'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-embedded-julia (in development, v0.5.0: milestones M0, the oracle harness, M1, the parser, and M2, the lowering, are done; M3, the Core runtime, has types, subtyping, specificity and dispatch):a Julia interpreter in pure Go that can be embedded, for the julia cells of go-notebook and its WebAssembly playground."

# Every field below is rendered by layouts/index.html. A field nothing renders
# does not stay true. Every statement is from the roadmap's bibliography,
# bib/julia.md (go-scikit/roadmap, on main); none is a result.
[[params.repos]]
  name  = "julia"
  kind  = "source"
  href  = "https://github.com/go-embedded-julia/julia"
  blurb = "The interpreter. Its M0, the oracle harness against julia 1.12.6, and M1, a Go port of JuliaSyntax identical to Meta.parseall on 1191/1191 files of julia's tree, are released as v0.2.0 (2026-10-26). M2, lowering, a Go port of julia 1.12.6's femtolisp front end identical to Meta.lower on 53 997 of 53 997 forms of julia's tree (1191/1191 files), is released as v0.3.0 (2026-10-28). M3, the Core runtime, is in progress: the core package (v0.3.0, v0.4.0) holds Julia's type objects, apply_type, subtyping and method specificity, and core/dispatch (v0.5.0, 2026-10-30) the method tables and the dispatch of concrete calls."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-embedded-julia.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the plan and its milestones, the architecture, the runtime boundary with its counts, and the licences. <a href=\"https://github.com/go-embedded-julia/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-embedded-julia/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants. The mark is Julia's subtype operator, <code>&lt;:</code>."

# The cards of #scope.
[[params.scope]]
  name = "Julia's own front end, in Go"
  what = "JuliaSyntax (the parser, 11 326 lines of Julia) and the femtolisp lowering julia 1.12.6 ships (<code>julia-syntax.scm</code>, <code>macroexpand.scm</code>, <code>ast.scm</code>, <code>match.scm</code>) ported to Go. Until Base is loaded no Julia can run, so the front end has to be native: a Go VM has no femtolisp."
[[params.scope]]
  name = "An interpreter over lowered IR"
  what = "The whole instruction set an interpreter must execute is 12 node types and 30 <code>Expr</code> heads. Julia's own C interpreter over it, <code>src/interpreter.c</code>, is 1 118 lines."
[[params.scope]]
  name = "Julia's Base, unchanged"
  what = "Base (140 705 lines of Julia) is run as is through the interpreter, at build time, and the resulting heap is shipped as an image. Nothing of Base is rewritten natively, so a Base fix upstream is not ported twice."
[[params.scope]]
  name = "The runtime boundary on fleet libraries"
  what = "Intrinsics, <code>ccall</code> targets and the runtime itself map onto Go: <code>math/big</code> and go-bignum for GMP and MPFR, go-ndarray for BLAS and LAPACK, the regexp stack of go-ruby-regexp for PCRE2, go-fft for FFTs."
[[params.scope]]
  name = "For go-notebook"
  what = "The <code>julia</code> cells of go-notebook and of its WebAssembly playground, the way rbgo, the Ruby VM of go-embedded-ruby, backs its <code>ruby</code> cells."
[[params.scope]]
  name = "Licences kept clean"
  what = "Julia is MIT, and its front end, runtime and Base may be translated to Go with the notice kept. The GPL parts of SuiteSparse are avoided, and GMP and MPFR (LGPL) are neither linked nor translated."

# The cards of #milestones, in order. state is "in development" for the two the
# plan has started, "planned" for the others.
[[params.milestones]]
  id    = "M0"
  name  = "Oracle harness"
  size  = "S"
  state = "done"
  what  = "Done: merged as pull request 1 of go-embedded-julia/julia, against julia 1.12.6. A Go tool that runs the reference <code>julia</code> (a pinned release) on a corpus and stores its outputs: parse trees, <code>Meta.lower</code>, <code>Test</code> summaries, printed values. Exit test: the outputs are checked in as golden files, regenerated by one command."
[[params.milestones]]
  id    = "M1"
  name  = "Parser"
  size  = "L"
  state = "done"
  what  = "Done: released as v0.2.0 (2026-10-26), a Go port of JuliaSyntax 29ec5226f7b1 (the version julia 1.12.6 ships). <code>syntax.ParseAll</code> returns the same <code>Expr</code> as <code>Meta.parseall</code>: tokens, green trees and <code>Expr</code> identical on 1191 of 1191 files of julia 1.12.6's share/julia tree (base, Compiler, stdlib, test; 18.5 MB) and on 976 of 976 golden snippets. One core: 0.98 s against 1.39 s for julia (0.70x). Bounded (64 MiB, depth 4000) and fuzzed. Known gap: on a few malformed inputs JuliaSyntax itself throws and julia falls back to flisp, which is not ported."
[[params.milestones]]
  id    = "M2"
  name  = "Lowering and macro expansion"
  size  = "L"
  state = "done"
  what  = "Done: released as v0.3.0 (2026-10-28). The <code>lower</code> package ports julia 1.12.6's femtolisp front end (<code>julia-syntax.scm</code>, <code>macroexpand.scm</code>, <code>ast.scm</code>, <code>match.scm</code>): <code>lower.NewState().Lower(ex)</code> is <code>Meta.lower</code> of a macro-expanded top-level form, compared field by field modulo gensym numbering. Identical on 53 997 of 53 997 forms of julia's share/julia tree (base, Compiler, stdlib, test; 1191 of 1191 files), 124 of 124 lowering snippets, 48 of 48 hygienic-scope forms and 477 of 477 built expressions (error paths, rare heads); <code>deparse</code> 119 of 119 and front-end functions 151 of 151 against <code>julia --lisp</code>. 100% statement coverage. <code>Lower</code> refuses trees deeper than <code>lower.MaxDepth</code> (1000) and <code>FuzzLower</code> runs on every pull request. Known gap: a Float64 inside a lowering error message returns <code>lower.ErrUnsupported</code>."
[[params.milestones]]
  id    = "M3"
  name  = "Core runtime"
  size  = "XL"
  state = "in development"
  what  = "In progress. Types, subtyping, method tables, dispatch, the builtins (63 in julia 1.12.6), the intrinsics (93 in julia 1.12.6), the interpreter and <code>boot.jl</code>. Released so far: core (v0.3.0, v0.4.0) — Julia's type objects, apply_type, and subtyping (a port of jltypes.c and subtype.c of 1.12.6, without intersection): identical to julia on 20 000 random pairs and 4 902 cases from test/subtype.jl; and method specificity (jl_type_morespecific), identical to Base.morespecific on the same corpus. core/dispatch (v0.5.0): method tables with world ages and the dispatch of concrete calls, identical to julia's <code>which</code> and dispatch environment on 9 000 calls over 1 500 random method tables (4 675 method choices, 87 ambiguities). Not yet: type intersection (and with it the interference sets julia 1.12 uses to order matches), the builtins, the intrinsics and the interpreter. Exit test: <code>test/subtype.jl</code>, <code>specificity.jl</code>, <code>intrinsics.jl</code> and the parts of <code>core.jl</code> that need no Base I/O."
[[params.milestones]]
  id    = "M4"
  name  = "Base bootstrap and image"
  size  = "XL"
  state = "planned"
  what  = "<code>Base_compiler.jl</code> and <code>Base.jl</code> evaluated; the <code>jl_*</code>, libc and libuv shim (about 524 + 88 + 78 call sites); the Compiler interpreted for <code>_return_type</code>; an image writer and reader. Exit test: Base loads, and a list of <code>test/</code> files passes."
[[params.milestones]]
  id    = "M5"
  name  = "Numeric boundary"
  size  = "L"
  state = "planned"
  what  = "GMP and MPFR on <code>math/big</code> and go-bignum, a PCRE2 front end on go-ruby-regexp, utf8proc tables, a dSFMT port, Printf, Dates, Random, Statistics and LinearAlgebra on go-ndarray. Exit test: the gmp, mpfr, regex, unicode, rational and complex tests, and the standard-library tests, with seeded Random streams byte-identical."
[[params.milestones]]
  id    = "M6"
  name  = "Notebook bridge and go-scikit/julia"
  size  = "M"
  state = "planned"
  what  = "The Julia to Go value table, the names a cell defines and uses, errors and worker limits, and the go-scikit bindings. Exit test: a mixed Go and Julia example notebook transcript in the go-notebook docs."
[[params.milestones]]
  id    = "M7"
  name  = "WebAssembly playground"
  size  = "M"
  state = "planned"
  what  = "A lazily loaded Julia core, image loading, and SVG display through the existing sanitizer. Exit test: a first result in less time than the Ruby core on the same machine, with the size recorded."

# The cards of #boundary and their count come from this list. Each number is
# from the bibliography's sections 1 and 3, counted by a Go program over the
# Julia sources, not estimated.
[[params.boundary]]
  name = "93 intrinsics in julia 1.12.6"
  what = "The bibliography counted 94 (81 <code>ADD_I</code>, 12 <code>ALIAS</code> and 1 hidden) on julia 1.15-DEV sources; julia 1.12.6, the release the port follows, has 93. All but <code>llvmcall</code> and the pointer group map to Go in a few lines each, on <code>math/bits</code> and <code>math</code>."
[[params.boundary]]
  name = "63 builtins in julia 1.12.6"
  what = "The bibliography counted 83 on julia 1.15-DEV sources; julia 1.12.6 has 63. From <code>src/builtin_proto.h</code>: <code>getfield</code>, <code>setfield!</code>, <code>isa</code>, <code>===</code>, <code>apply_type</code>, <code>invoke</code> and the rest, each one a Go function."
[[params.boundary]]
  name = "896 ccall sites in base/"
  what = "856 <code>ccall</code> and 40 <code>@ccall</code> in 202 files. By target: 524 on the Julia runtime and <code>ios_*</code>, 88 on libc, 81 on MPFR (and 29 more generated by loops), 78 on libuv, 40 on GMP, 18 on PCRE2, 15 on utf8proc."
[[params.boundary]]
  name = "0 libm calls, 0 llvmcall"
  what = "Base's elementary functions are written in Julia over intrinsics, so they are bit-identical by construction, and Base has no <code>llvmcall(</code> site."
[[params.boundary]]
  name = "194 sites in LinearAlgebra"
  what = "182 call BLAS and LAPACK. They are implemented as Go functions over go-ndarray's <code>linalg</code> on the column-major buffer a Julia matrix owns, without copying. Missing kernels are added to go-ndarray, not to the VM."
[[params.boundary]]
  name = "No FFT in Julia's Base"
  what = "Neither Base nor the standard library has one: an FFTW.jl-style API over go-fft is a separate package, not part of the VM."

