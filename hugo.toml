baseURL = 'https://go-embedded-julia.github.io/'
locale  = 'en-us'
title   = 'go-embedded-julia'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-embedded-julia (in development, v0.26.0: milestones M0, the oracle harness, M1, the parser, M2, the lowering, and M3, the runtime, are done; julia 1.12.6's real Base and seven stdlibs build and initialize, with tasks, an event loop and a two-mode virtual file system; a VM loads a pinned prebuilt system image in about 0.65 s, and a Kernel runs notebook cells with soft scope, julia's error texts, budgets and cancellation, Go values in and out, and a Reset to its starting state without reloading, and stops the tasks and timers cells started; BLAS runs through go-blas in place on a typed Float64 store, level 3 included): a Julia interpreter in pure Go that can be embedded, for the julia cells of go-notebook and its WebAssembly playground."

# Every field below is rendered by layouts/index.html. A field nothing renders
# does not stay true. Every statement is from the roadmap's bibliography,
# bib/julia.md (go-scikit/roadmap, on main); none is a result.
[[params.repos]]
  name  = "julia"
  kind  = "source"
  href  = "https://github.com/go-embedded-julia/julia"
  blurb = "The interpreter. Its M0, the oracle harness against julia 1.12.6, and M1, a Go port of JuliaSyntax identical to Meta.parseall on 1191/1191 files of julia's tree, are released as v0.2.0 (2026-10-26). M2, lowering, a Go port of julia 1.12.6's femtolisp front end identical to Meta.lower on 53 997 of 53 997 forms of julia's tree (1191/1191 files), is released as v0.3.0 (2026-10-28). M3, the runtime, is released as v0.13.0 (2026-11-14): the interpreter runs julia 1.12.6's real Base and seven stdlibs (FileWatching, Libdl, Artifacts, SHA, Sockets, LinearAlgebra, Random), with tasks, an event loop and a virtual file system in two modes. The system image is released as v0.14.0 (2026-11-15): a VM loads the image of a release, fetched by its pinned SHA-256, in about 0.65 s instead of building Base for 13 minutes. v0.15.0 (2026-11-15) adds Kernel, the session of a notebook: a per-cell Eval with julia's text/plain value, the cell's own stdout and stderr, errors as values, cancellation through a context and per-cell budgets, in a sandbox by default. v0.17.0 (2026-11-15) runs Kernel cells with the REPL's soft scope, prints julia's own text for a MethodError, and adds Get and Set of a global of Main as a Go value. v0.19.0 adds Has and TypeOf, Kernel.Reset (the kernel back in its starting state in 0.6 ms after an 18-cell corpus, where loading the image again takes about 0.85 s), utf8proc as a Go port (uppercase, lowercase and normalize work), A * x, A * B and x' * y through go-blas, and an interpreter that, measured by the maintainers and indicative only, runs a plain loop at 9 to 10 times the time of julia's own interpreter (15 times before) and builds Base in 212 s (about 340 s before). v0.20.0 makes Kernel.Reset stop the tasks and timers that cells started, and a refused image load no longer leaves the boot types of the shared caches changed. v0.23.0 makes catch_backtrace() and the backtrace of a failed task return an empty backtrace, as julia does with backtraces off, instead of raising a not-ported error. v0.24.0 has the Base image carry the inference of a Float64 matrix display, so the first Float64 matrix product and its display on a fresh kernel take 0.84 million interpreter statements instead of 69.6 million. v0.25.0 forwards LAPACK's getrf, getrs, potrf and potrs (single and double precision) to go-blas v0.4.0, so lu, A \\ b, factorize, cholesky and cholesky(A) \\ b work and raise SingularException and PosDefException. v0.26.0 runs the bodies of @generated functions (staged evaluation, cached once per signature in a bounded table), so SHA-1, SHA-256 and SHA-512 give the published FIPS digests and seeded random states differ by seed. The current release is v0.26.0 (v0.21.0 and v0.22.0 are the numeric ones): a Memory{Float64} is stored as a typed []float64, so the double-precision BLAS shims call go-blas in place at 1.02 to 1.16 times the cost of calling go-blas directly (3 to 22 times before), Kernel.Get and Set move []float64 and Matrix[float64] without boxing, New may be called concurrently, and level-3 BLAS trsm, trmm, syrk and symm (single and double precision) are forwarded to go-blas v0.3.0. Known limits: the image is not authenticated by itself and loading one writes process-shared type state (#49), the stdlibs are still julia's .jl sources (issue #36), only LU and Cholesky of LAPACK are there, so inv, qr, eigen, svd and the complex types are refused, as is UpperTriangular(A) \\ B (#67), rand(m, n) still reaches an llvmcall that is not ported (#120, partly addressed by #125, and seeded rand has not yet been compared with julia 1.12.6), other element types than Float64 may still pay the first matrix-display cost, a Memory of Float32 is still boxed, so a single-precision BLAS call copies, and writing a file in host mode is not ported yet (#32)."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-embedded-julia.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the plan and its milestones, the architecture, the Kernel page (the pinned image, Eval, Get and Set, Reset), the runtime boundary with its counts, and the licences. <a href=\"https://github.com/go-embedded-julia/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-embedded-julia/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants. The mark is Julia's subtype operator, <code>&lt;:</code>."

# The cards of #scope.
[[params.scope]]
  name = "Julia's own front end, in Go"
  what = "JuliaSyntax (the parser, 11 326 lines of Julia) and the femtolisp lowering julia 1.12.6 ships (<code>julia-syntax.scm</code>, <code>macroexpand.scm</code>, <code>ast.scm</code>, <code>match.scm</code>) ported to Go. Until Base is loaded no Julia can run, so the front end has to be native: a Go VM has no femtolisp."
[[params.scope]]
  name = "An interpreter over lowered IR"
  what = "The whole instruction set an interpreter must execute is 12 node types and 30 <code>Expr</code> heads. Julia's own C interpreter over it, <code>src/interpreter.c</code>, is 1 118 lines."
[[params.scope]]
  name = "Julia's Base, unchanged"
  what = "Base (140 705 lines of Julia) is run as is through the interpreter, at build time, and the resulting heap is shipped as an image. Nothing of Base is rewritten natively, so a Base fix upstream is not ported twice."
[[params.scope]]
  name = "The runtime boundary on fleet libraries"
  what = "Intrinsics, <code>ccall</code> targets and the runtime itself map onto Go: <code>math/big</code> and go-bignum for GMP and MPFR, go-blas for BLAS (and the LAPACK it is to gain), the regexp stack of go-ruby-regexp for PCRE2, go-fft for FFTs."
[[params.scope]]
  name = "For go-notebook"
  what = "The <code>julia</code> cells of go-notebook and of its WebAssembly playground, the way rbgo, the Ruby VM of go-embedded-ruby, backs its <code>ruby</code> cells."
[[params.scope]]
  name = "Licences kept clean"
  what = "Julia is MIT, and its front end, runtime and Base may be translated to Go with the notice kept. The GPL parts of SuiteSparse are avoided, and GMP and MPFR (LGPL) are neither linked nor translated."

# The cards of #milestones, in order. state is "done" for the released ones,
# "planned" for the others.
[[params.milestones]]
  id    = "M0"
  name  = "Oracle harness"
  size  = "S"
  state = "done"
  what  = "Done: merged as pull request 1 of go-embedded-julia/julia, against julia 1.12.6. A Go tool that runs the reference <code>julia</code> (a pinned release) on a corpus and stores its outputs: parse trees, <code>Meta.lower</code>, <code>Test</code> summaries, printed values. Exit test: the outputs are checked in as golden files, regenerated by one command."
[[params.milestones]]
  id    = "M1"
  name  = "Parser"
  size  = "L"
  state = "done"
  what  = "Done: released as v0.2.0 (2026-10-26), a Go port of JuliaSyntax 29ec5226f7b1 (the version julia 1.12.6 ships). <code>syntax.ParseAll</code> returns the same <code>Expr</code> as <code>Meta.parseall</code>: tokens, green trees and <code>Expr</code> identical on 1191 of 1191 files of julia 1.12.6's share/julia tree (base, Compiler, stdlib, test; 18.5 MB) and on 976 of 976 golden snippets. One core: 0.98 s against 1.39 s for julia (0.70x). Bounded (64 MiB, depth 4000) and fuzzed. Known gap: on a few malformed inputs JuliaSyntax itself throws and julia falls back to flisp, which is not ported."
[[params.milestones]]
  id    = "M2"
  name  = "Lowering and macro expansion"
  size  = "L"
  state = "done"
  what  = "Done: released as v0.3.0 (2026-10-28). The <code>lower</code> package ports julia 1.12.6's femtolisp front end (<code>julia-syntax.scm</code>, <code>macroexpand.scm</code>, <code>ast.scm</code>, <code>match.scm</code>): <code>lower.NewState().Lower(ex)</code> is <code>Meta.lower</code> of a macro-expanded top-level form, compared field by field modulo gensym numbering. Identical on 53 997 of 53 997 forms of julia's share/julia tree (base, Compiler, stdlib, test; 1191 of 1191 files), 124 of 124 lowering snippets, 48 of 48 hygienic-scope forms and 477 of 477 built expressions (error paths, rare heads); <code>deparse</code> 119 of 119 and front-end functions 151 of 151 against <code>julia --lisp</code>. 100% statement coverage. <code>Lower</code> refuses trees deeper than <code>lower.MaxDepth</code> (1000) and <code>FuzzLower</code> runs on every pull request. Known gap: a Float64 inside a lowering error message returns <code>lower.ErrUnsupported</code>."
[[params.milestones]]
  id    = "M3"
  name  = "Core runtime"
  size  = "XL"
  state = "done"
  what  = "Done: released as v0.13.0 (2026-11-14). The interpreter runs julia 1.12.6's real Base and its seven stdlibs (FileWatching, Libdl, Artifacts, SHA, Sockets, LinearAlgebra, Random): <code>sysimg.jl</code> builds the whole system image, and <code>VM.RunModuleInitializers</code> runs <code>Base.__init__</code> and every stdlib's <code>__init__</code>. 16 Base-level task programs (<code>@async</code>, <code>Channel</code>, <code>Condition</code>, <code>Timer</code>, <code>sleep</code>, <code>ReentrantLock</code>, <code>Threads.@spawn</code>, <code>ScopedValue</code>) give julia's own text/plain output. Tasks and the event loop: one goroutine per task with a baton, the per-task state saved at each switch, a libuv loop in Go, <code>@cfunction</code>, and <code>ErrDeadlock</code> for a wait that nothing can end, where julia would hang. A VFS in two modes: the sandbox (julia's tree, read-only) and host mode (the real file system on macOS, Linux and Windows). Dynamic libraries are the libraries the VM implements in Go; libblastrampoline reports julia's configuration; loading a C library is a stated divergence. Module references name the module object, not its name; runtime calls such as <code>uv_random</code>, <code>llvmcall</code> of <code>atomics.jl</code>'s IR templates and <code>jl_module_names</code> are ported. It builds on every Go target, and is tested on 386, arm, riscv64, s390x, ppc64le and loong64 (floats are bit-exact independently of the FPU) and on macOS, Linux and Windows. Built on the earlier releases: Julia's type objects, subtyping, specificity and dispatch (core v0.3.0 to v0.5.0), and the interpreter (interp v0.6.0 to v0.12.0: struct and abstract type definitions, where methods, macro expansion, boot.jl, arrays). Known limits: <code>[@async i^2 for i in 1:4]</code> is correct but takes minutes, which is under investigation; the stdlibs are still julia's <code>.jl</code> sources (rewriting them in Go is issue #36); BLAS had no kernel at v0.13.0 and has gemm, gemv and level 1 since v0.18.0 and trsm, trmm, syrk and symm since v0.22.0 (LAPACK is #67); writing a file in host mode is not ported yet (#32). Subtyping is slower than <code>jl_subtype</code> on one core, an open defect tracked in issue #20."
[[params.milestones]]
  id    = "M4"
  name  = "Base bootstrap and image"
  size  = "XL"
  state = "partial"
  what  = "The image is done, released as v0.14.0 (2026-11-15). Its first half shipped with M3 in v0.13.0: <code>Base_compiler.jl</code>, <code>Base.jl</code> and the stdlibs evaluate, and the <code>jl_*</code>, libc and libuv calls Base reaches are ported. v0.14.0 adds the image writer and reader (<code>SaveImage</code>, <code>LoadImage</code>, a deterministic format that gives the same SHA-256 on linux/amd64, linux/arm64 and darwin/arm64), the release asset built by CI, and <code>FetchImage</code>, which refuses any digest but the one the consumer pins: a VM loads Base in about 0.65 s rather than building it for 13 minutes at each boot (go-embedded-julia/julia#40). Left: the exit test, a list of julia's <code>test/</code> files passing."
[[params.milestones]]
  id    = "M5"
  name  = "Numeric boundary"
  size  = "L"
  state = "partial"
  what  = "GMP and MPFR on <code>math/big</code> and go-bignum, a PCRE2 front end on go-ruby-regexp, a dSFMT port, Printf, Dates, Random, Statistics and LinearAlgebra on go-blas and go-ndarray. Started: utf8proc is a Go port (v0.18.0: <code>uppercase</code>, <code>lowercase</code> and <code>normalize</code> match julia 1.12.6 over every code point) and julia's <code>gemm</code>, <code>gemv</code>, level-1 and (v0.22.0) level-3 <code>trsm</code>, <code>trmm</code>, <code>syrk</code> and <code>symm</code> BLAS routines run on go-blas in single and double precision (<code>A * B</code>, <code>A * x</code>, <code>x' * y</code>, <code>A' * A</code>, <code>Symmetric(A) * B</code>, <code>B / UpperTriangular(A)</code>), within go-blas' stated error bound and not bit for bit with OpenBLAS; since v0.21.0 a <code>Memory{Float64}</code> is a typed <code>[]float64</code> that the double-precision routines use in place, at 1.02 to 1.16 times the cost of calling go-blas directly. Since v0.25.0 LAPACK's <code>getrf</code>, <code>getrs</code>, <code>potrf</code> and <code>potrs</code> run too (<code>lu</code>, <code>A \\ b</code>, <code>cholesky</code>); the rest is issue #67: <code>inv</code>, <code>qr</code>, <code>eigen</code>, <code>svd</code> and <code>UpperTriangular(A) \\ B</code> are refused. Exit test: the gmp, mpfr, regex, unicode, rational and complex tests, and the standard-library tests, with seeded Random streams byte-identical."
[[params.milestones]]
  id    = "M6"
  name  = "Notebook bridge and go-scikit/julia"
  size  = "M"
  state = "partial"
  what  = "The per-cell <code>Eval</code>, the Julia to Go value table and <code>Reset</code> are done, released as <code>Kernel</code> (v0.15.0, 2026-11-15) and completed in v0.19.0: julia's text/plain value, the cell's own stdout and stderr, errors as values with julia's own showerror text (<code>MethodError</code> included), the REPL's soft scope, cancellation through a context (an <code>InterruptException</code> in the cell), per-cell budgets (time, statements, allocations, output) with typed errors, the sandbox by default, and <code>Get</code>, <code>Set</code>, <code>Has</code> and <code>TypeOf</code> of a global as a Go value (Int64, Float64 with every bit, Bool, String, Vector and Matrix of Float64 and Int64). <code>Reset</code> puts the kernel back in its starting state, <code>rand</code>'s generator included, for the next run of a notebook: an undo log of the writes to the image's objects, replayed in reverse, took 0.6 ms after an 18-cell corpus where loading the image again takes about 0.85 s, and an answer identical to a fresh kernel's cell for cell; past 262144 logged writes it loads the image again and says so. Since v0.20.0 a <code>Reset</code> also ends the tasks a cell started that have not finished and drops the libuv timers it opened, without running their <code>finally</code> blocks (<code>ResetInfo.Tasks</code> and <code>Timers</code>, <code>Kernel.Tasks()</code>), and a kernel yields once when it is made so that Base's own tasks are parked before the state <code>Reset</code> returns to. Since v0.21.0 <code>Get</code> and <code>Set</code> of a <code>[]float64</code> or a <code>Matrix[float64]</code> box nothing. Left: the go-scikit bindings, and the exit test: a mixed Go and Julia example notebook transcript in the go-notebook docs."
[[params.milestones]]
  id    = "M7"
  name  = "WebAssembly playground"
  size  = "M"
  state = "planned"
  what  = "A lazily loaded Julia core, image loading, and SVG display through the existing sanitizer. Exit test: a first result in less time than the Ruby core on the same machine, with the size recorded."

# The cards of #boundary and their count come from this list. Each number is
# from the bibliography's sections 1 and 3, counted by a Go program over the
# Julia sources, not estimated.
[[params.boundary]]
  name = "93 intrinsics in julia 1.12.6"
  what = "The bibliography counted 94 (81 <code>ADD_I</code>, 12 <code>ALIAS</code> and 1 hidden) on julia 1.15-DEV sources; julia 1.12.6, the release the port follows, has 93. All but <code>llvmcall</code> and the pointer group map to Go in a few lines each, on <code>math/bits</code> and <code>math</code>."
[[params.boundary]]
  name = "63 builtins in julia 1.12.6"
  what = "The bibliography counted 83 on julia 1.15-DEV sources; julia 1.12.6 has 63. From <code>src/builtin_proto.h</code>: <code>getfield</code>, <code>setfield!</code>, <code>isa</code>, <code>===</code>, <code>apply_type</code>, <code>invoke</code> and the rest, each one a Go function."
[[params.boundary]]
  name = "896 ccall sites in base/"
  what = "856 <code>ccall</code> and 40 <code>@ccall</code> in 202 files. By target: 524 on the Julia runtime and <code>ios_*</code>, 88 on libc, 81 on MPFR (and 29 more generated by loops), 78 on libuv, 40 on GMP, 18 on PCRE2, 15 on utf8proc."
[[params.boundary]]
  name = "0 libm calls, 0 llvmcall"
  what = "Base's elementary functions are written in Julia over intrinsics, so they are bit-identical by construction, and Base has no <code>llvmcall(</code> site."
[[params.boundary]]
  name = "194 sites in LinearAlgebra"
  what = "182 call BLAS and LAPACK. Since v0.18.0 <code>gemm</code>, <code>gemv</code> and the level-1 routines, and since v0.22.0 <code>trsm</code>, <code>trmm</code>, <code>syrk</code> and <code>symm</code> (single and double precision), are forwarded to go-blas. A <code>Memory{Float64}</code> is a typed <code>[]float64</code> since v0.21.0, so the double-precision routines run on it in place, at 1.02 to 1.16 times the cost of calling go-blas directly; a <code>Float32</code> memory is still boxed and copied. Since v0.25.0 LAPACK's <code>getrf</code>, <code>getrs</code>, <code>potrf</code> and <code>potrs</code> are forwarded too; the rest is issue #67. Missing kernels are added to the fleet's libraries, not to the VM."
[[params.boundary]]
  name = "No FFT in Julia's Base"
  what = "Neither Base nor the standard library has one: an FFTW.jl-style API over go-fft is a separate package, not part of the VM."

